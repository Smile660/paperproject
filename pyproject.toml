[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pvvr"
version = "0.1.0"
description = "分布式光伏电压调节仿真平台（公平二分法）"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==7.4.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
